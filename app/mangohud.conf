# Autogamer's MangoHud bar: run.sh copies this to the run folder (fills @LABEL@ and @SYS@, drops the model field for
# games without a model) and points MANGOHUD_CONFIGFILE at the copy, so the system's own MangoHud.conf is never
# touched. MangoHud rereads the copy when it changes, so it can be tried out live.
# One horizontal bar of big outlined text across the top (RetroArch's captions use the bottom-left): the battery icon
# and its draw, the system and fps, the frame-time graph, CPU load and temperature, the label, then the model field,
# exec=cat of a file hud.py writes atomically (exec shows one line). MangoHud's font has Latin-1 only, so hud.py's
# bars are ASCII; '#' starts a comment even in a value. Not hud_compact: its values are as wide as they are (CPU 8%,
# 10W), so everything after them shifts; full mode right-aligns them in fixed columns. Without the frame-time figure
# the longest model field ("14.0t/s |||||||. read [====--]") fits after the longest label ("E4B HARDEST 1/1.5"). Labels dim green,
# values bright. legacy_layout=0 is what makes custom_text/exec show.
control=autogamer
position=top-left
horizontal
legacy_layout=0
table_columns=3
font_file=/usr/share/fonts/liberation/LiberationMono-Regular.ttf
font_size=34
font_size_secondary=34
background_alpha=0.6
text_outline=1
text_color=00FF00
engine_color=00A000
cpu_color=00A000
battery_color=00A000
battery
battery_icon
battery_watt
fps
fps_text=@SYS@
frametime=0
frame_timing
cpu_stats
cpu_text=CPU
cpu_temp
custom_text=@LABEL@
exec=cat /dev/shm/autogamer/hud.txt
