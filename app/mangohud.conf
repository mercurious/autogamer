# Autogamer's MangoHud bar: run.sh copies this to the run folder (fills @LABEL@, drops the model field for games
# without a model) and points MANGOHUD_CONFIGFILE at the copy, so the system's own MangoHud.conf is never touched.
# One horizontal bar of big outlined green text; the model field is exec=cat of a file hud.py writes atomically
# (exec shows one line). Top of the screen: RetroArch's captions use the bottom-left. legacy_layout=0 is what makes
# custom_text/exec show.
control=autogamer
position=top-left
horizontal
legacy_layout=0
table_columns=3
font_file=/usr/share/fonts/liberation/LiberationMono-Regular.ttf
font_size=34
font_size_secondary=34
background_alpha=0.6
text_outline=1
text_color=00FF00
fps
frame_timing
custom_text=@LABEL@
exec=cat /dev/shm/autogamer/hud.txt
