# Autogamer: appended only while run.sh has switched the panel to 60 Hz. Pace by vsync, not by the audio buffer.
# A/B on a 12 GB Flip 2 (2026-10-09, NES Tetris, MangoHud per-frame CSV, 30 s each): stock (120 Hz, audio_sync on, threaded
# video) 70% of frames off the 16.7 ms cadence (20 ms frames + 1-4 ms catch-ups: PulseAudio's 20 ms period);
# 60 Hz + audio_sync/threaded off 4.8%, p99 20.5 ms, but the game ran 3% fast (61.8 frames/s: Tetris music);
# + vrr_runloop_enable (sync to exact content framerate) 60.02 frames/s, 1.0% off cadence. At 120 Hz without audio_sync the game runs at double speed: never alone.
audio_sync = "false"
video_threaded = "false"
vrr_runloop_enable = "true"
