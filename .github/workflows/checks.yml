name: checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: No ROMs, saves or captures in the tree
        run: sh test/check_no_roms.sh
      - name: Python compiles
        run: python3 -m py_compile app/*.py tools/*.py test/*.py
      - name: Shell parses
        run: for f in install.sh app/*.sh build/*.sh test/*.sh ports/*.sh installer/*.sh; do sh -n "$f" || exit 1; done
      - name: ROM finding
        run: python3 test/test_games.py
